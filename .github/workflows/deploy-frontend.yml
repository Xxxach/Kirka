name: Deploy frontend (GitHub Pages)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'server/**'
      - 'photo-server/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # По умолчанию сайт лежит в /<имя-репозитория>/ (для Kirka это /Kirka/).
          # Если подключишь свой домен — создай переменную VITE_BASE со значением /
          VITE_BASE: ${{ vars.VITE_BASE || format('/{0}/', github.event.repository.name) }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_PHOTO_API_URL: ${{ vars.VITE_PHOTO_API_URL }}

      # Нужно, чтобы прямые ссылки вида /Kirka/photo-page открывались,
      # а не давали 404 от GitHub Pages (приложение само разберёт путь).
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
