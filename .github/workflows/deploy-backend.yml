name: Deploy backend (Yandex Cloud)

# Срабатывает при пуше изменений в server/ или photo-server/,
# а также вручную: вкладка Actions -> Deploy backend -> Run workflow.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'photo-server/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  # ---------- Текстовый сервер (Node + Express) ----------
  text-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Build and push image
        env:
          IMAGE: cr.yandex/${{ vars.YC_REGISTRY_ID }}/kirka-text:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" ./server
          docker push "$IMAGE"

      - name: Deploy container
        id: deploy
        uses: yc-actions/yc-sls-container-deploy@v5
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          container-name: kirka-text
          folder-id: ${{ vars.YC_FOLDER_ID }}
          public: true
          revision-service-account-id: ${{ vars.YC_SA_ID }}
          revision-cores: 1
          revision-memory: 256Mb
          revision-core-fraction: 100
          revision-concurrency: 8
          revision-execution-timeout: 60
          revision-image-url: cr.yandex/${{ vars.YC_REGISTRY_ID }}/kirka-text:${{ github.sha }}
          revision-env: |
            CF_ACCOUNT_ID=${{ secrets.CF_ACCOUNT_ID }}
            CF_API_TOKEN=${{ secrets.CF_API_TOKEN }}
            FRONTEND_ORIGIN=${{ vars.FRONTEND_ORIGIN }}
            TRUST_PROXY=true

      - name: Show URL
        run: |
          echo "### Текстовый сервер (VITE_API_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${{ steps.deploy.outputs.id }}.containers.yandexcloud.net" >> "$GITHUB_STEP_SUMMARY"

  # ---------- Фото-сервер (Flask, лёгкая версия без rembg/opencv) ----------
  photo-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Build and push image
        env:
          IMAGE: cr.yandex/${{ vars.YC_REGISTRY_ID }}/kirka-photo:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" ./photo-server
          docker push "$IMAGE"

      - name: Deploy container
        id: deploy
        uses: yc-actions/yc-sls-container-deploy@v5
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          container-name: kirka-photo
          folder-id: ${{ vars.YC_FOLDER_ID }}
          public: true
          revision-service-account-id: ${{ vars.YC_SA_ID }}
          revision-cores: 1
          revision-memory: 512Mb
          revision-core-fraction: 100
          revision-concurrency: 2
          revision-execution-timeout: 120
          revision-image-url: cr.yandex/${{ vars.YC_REGISTRY_ID }}/kirka-photo:${{ github.sha }}
          revision-env: |
            FRONTEND_ORIGIN=${{ vars.FRONTEND_ORIGIN }}
            TRUST_PROXY=true
            HEAVY_MODES_ENABLED=false

      - name: Show URL
        run: |
          echo "### Фото-сервер (VITE_PHOTO_API_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${{ steps.deploy.outputs.id }}.containers.yandexcloud.net" >> "$GITHUB_STEP_SUMMARY"
